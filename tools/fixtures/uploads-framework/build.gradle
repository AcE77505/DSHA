plugins { id 'java' }

repositories {
    mavenCentral()
    google()
}

configurations { androidAars }
dependencyLocking { lockAllConfigurations() }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation('org.robolectric:robolectric:4.15.1') {
        exclude group: 'androidx.test', module: 'monitor'
        exclude group: 'androidx.test.espresso', module: 'espresso-idling-resource'
    }
    testImplementation 'org.robolectric:android-all:14-robolectric-10818077'
    androidAars 'androidx.test:monitor:1.8.0@aar'
    androidAars 'androidx.test.espresso:espresso-idling-resource:3.6.1@aar'
    testImplementation files('../../../artifacts/pr171/uploads/unit')
}

def aarJars = tasks.register('extractAndroidAars') {
    inputs.files(configurations.androidAars)
    outputs.dir(layout.buildDirectory.dir('aar-jars'))
    doLast {
        configurations.androidAars.files.each { archive ->
            copy {
                from zipTree(archive)
                include 'classes.jar'
                into layout.buildDirectory.dir('aar-jars/' + archive.name)
            }
        }
    }
}

sourceSets.test.java.srcDirs = ['src/test/java']

tasks.named('compileTestJava') {
    dependsOn aarJars
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
    source files(
        '../../../app/src/main/java/com/deepseekharness/app/ui/PictureInPictureFrame.java',
        '../../../app/src/main/java/com/deepseekharness/app/ui/WebUploads.java',
        '../../../app/src/main/java/com/deepseekharness/app/backup/DocumentStreams.java',
        '../../../app/src/main/java/com/deepseekharness/app/backup/BackupControl.java',
        '../../../app/src/main/java/com/deepseekharness/app/util/Ids.java')
    classpath += files(provider { fileTree(layout.buildDirectory.dir('aar-jars')) { include '**/*.jar' } })
}

tasks.named('test') {
    dependsOn aarJars
    classpath += files(provider { fileTree(layout.buildDirectory.dir('aar-jars')) { include '**/*.jar' } })
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    maxHeapSize = '1g'
    jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
    testLogging { events 'passed', 'failed'; exceptionFormat = 'full' }
}
